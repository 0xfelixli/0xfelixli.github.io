<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 360" font-family="-apple-system, PingFang SC, Hiragino Sans GB, Noto Sans CJK SC, sans-serif" font-size="13">
  <rect width="760" height="360" fill="#ffffff"/>
  <text x="380" y="26" text-anchor="middle" font-size="15" font-weight="600" fill="#222">2026 年 3–9 月：prompt 数量涨了 7 倍，中位长度掉到 20 字</text>

  <!-- axes -->
  <line x1="70" y1="290" x2="700" y2="290" stroke="#999"/>
  <line x1="70" y1="60" x2="70" y2="290" stroke="#999"/>
  <line x1="700" y1="60" x2="700" y2="290" stroke="#999"/>

  <!-- left axis: prompts (0-6000) -->
  <text x="62" y="294" text-anchor="end" fill="#666">0</text>
  <text x="62" y="217" text-anchor="end" fill="#666">2000</text>
  <text x="62" y="140" text-anchor="end" fill="#666">4000</text>
  <text x="62" y="64" text-anchor="end" fill="#666">6000</text>
  <text x="20" y="50" fill="#4a6fa5" font-size="12">条 prompt / 月</text>

  <!-- right axis: median length (0-100) -->
  <text x="708" y="294" fill="#666">0</text>
  <text x="708" y="179" fill="#666">50</text>
  <text x="708" y="64" fill="#666">100</text>
  <text x="640" y="50" fill="#c0392b" font-size="12">中位长度（字）</text>

  <!-- bars: x centers 115,205,295,385,475,565,655 ; width 50 ; scale 230px/6000 -->
  <g fill="#4a6fa5" opacity="0.85">
    <rect x="90"  y="274.2" width="50" height="15.8"/>
    <rect x="180" y="260.9" width="50" height="29.1"/>
    <rect x="270" y="274.6" width="50" height="15.4"/>
    <rect x="360" y="265.4" width="50" height="24.6"/>
    <rect x="450" y="259.9" width="50" height="30.1"/>
    <rect x="540" y="66.9"  width="50" height="223.1"/>
    <rect x="630" y="193.4" width="50" height="96.6"/>
  </g>
  <g fill="#4a6fa5" font-size="11" text-anchor="middle">
    <text x="115" y="270">412</text>
    <text x="205" y="256">758</text>
    <text x="295" y="270">401</text>
    <text x="385" y="261">641</text>
    <text x="475" y="255">784</text>
    <text x="565" y="62">5821</text>
    <text x="655" y="189">2519</text>
  </g>

  <!-- line: median length, scale 230px/100 ; y = 290 - v*2.3 -->
  <polyline fill="none" stroke="#c0392b" stroke-width="2.5"
    points="115,203.8 205,81.9 295,147.4 385,207.2 475,232.5 565,230.2 655,244"/>
  <g fill="#c0392b">
    <circle cx="115" cy="203.8" r="4"/><circle cx="205" cy="81.9" r="4"/><circle cx="295" cy="147.4" r="4"/>
    <circle cx="385" cy="207.2" r="4"/><circle cx="475" cy="232.5" r="4"/><circle cx="565" cy="230.2" r="4"/><circle cx="655" cy="244" r="4"/>
  </g>
  <g fill="#c0392b" font-size="11" text-anchor="middle">
    <text x="115" y="196">38</text>
    <text x="205" y="74">91</text>
    <text x="295" y="140">62</text>
    <text x="385" y="200">36</text>
    <text x="475" y="225">25</text>
    <text x="565" y="223">26</text>
    <text x="655" y="237">20</text>
  </g>

  <!-- x labels -->
  <g fill="#444" text-anchor="middle">
    <text x="115" y="310">3 月</text><text x="205" y="310">4 月</text><text x="295" y="310">5 月</text>
    <text x="385" y="310">6 月</text><text x="475" y="310">7 月</text><text x="565" y="310">8 月</text><text x="655" y="310">9 月*</text>
  </g>
  <g fill="#888" font-size="11" text-anchor="middle">
    <text x="115" y="328">≤10 字 17%</text><text x="205" y="328">21%</text><text x="295" y="328">16%</text>
    <text x="385" y="328">17%</text><text x="475" y="328">25%</text><text x="565" y="328">26%</text><text x="655" y="328">29%</text>
  </g>
  <text x="380" y="350" text-anchor="middle" fill="#888" font-size="11">* 9 月只统计到 12 日。底行是 10 字以内 prompt 的占比。数据来自本机 Claude Code 与 Codex 的会话记录。</text>
</svg>
